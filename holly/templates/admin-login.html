<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - HollyBlue</title>
    <link rel="shortcut icon" type="image/x-icon" href="https://hollyblueinterio.com/images/abc/fav.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-image: url("https://images.unsplash.com/photo-1618219908412-a29a1bb7b86e?q=80&w=2000&auto=format&fit=crop");
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .logo-img { height: 60px; margin-bottom: 20px; }

        .login-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .input-group { margin-bottom: 20px; text-align: left; }

        .input-label {
            font-size: 12px;
            color: #666;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .login-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .login-input:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-login:hover { background: #0d47a1; }

        .error-msg {
            color: #d32f2f;
            background: #fdecea;
            padding: 10px;
            font-size: 13px;
            margin-top: 15px;
            border-radius: 4px;
            display: none; /* Hidden by default */
            border: 1px solid #fab3ae;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img class="logo-img" src="https://hollyblueinterio.com/images/abc/logo.png" alt="HollyBlue">
        <div class="login-title">Admin Login</div>

        <form id="loginForm">
            <div class="input-group">
                <label class="input-label">Username</label>
                <input type="text" id="username" class="login-input" placeholder="admin" required>
            </div>

            <div class="input-group">
                <label class="input-label">Password</label>
                <input type="password" id="password" class="login-input" placeholder="admin" required>
            </div>

            <button type="submit" class="btn-login">LOGIN</button>
            <div id="errorMsg" class="error-msg">Invalid Username or Password</div>
        </form>
    </div>

    <script>
        const loginForm = document.getElementById("loginForm");
        const errorMsg = document.getElementById("errorMsg");
        const inputs = document.querySelectorAll(".login-input");

        // 1. Clear error message when user starts typing
        inputs.forEach(input => {
            input.addEventListener("input", () => {
                errorMsg.style.display = "none";
            });
        });

        // 2. Handle Login Logic
        loginForm.addEventListener("submit", function(e) {
            e.preventDefault();

            const u = document.getElementById("username").value;
            const p = document.getElementById("password").value;

            // CHECK CREDENTIALS
            if(u === "admin" && p === "admin") {
                // SUCCESS: Redirect to your dashboard
                window.location.href = "/custom-admin-dashboard/";
            } else {
                // FAILURE: Show error message
                errorMsg.style.display = "block";
            }
        });
    </script>

</body>
</html>
